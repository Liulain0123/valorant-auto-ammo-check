<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL-AmmoCheck | Bypass Edition</title>
    <style>
        :root {
            --val-red: #ff4655;
            --val-dark: #0f1923;
            --val-gray: #ece8e1;
            --val-black: #111111;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--val-dark);
            color: var(--val-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #main-content {
            transition: opacity 0.5s ease;
        }
        .container {
            background: var(--val-black);
            padding: 3rem;
            border-top: 5px solid var(--val-red);
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status-badge {
            background-color: #2ecc71;
            color: white;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .feature-list {
            text-align: left;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 2rem;
            list-style: none;
            padding: 0;
        }
        .feature-list li::before {
            content: "✓";
            color: var(--val-red);
            margin-right: 10px;
            font-weight: bold;
        }
        .btn {
            background-color: var(--val-red);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s;
            display: inline-block;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #d13b48;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.4);
        }
        .warning {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #555;
            border: 1px solid #333;
            padding: 10px;
        }
        /* 影片播放器容器 - 初始隱藏 */
        #video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 80%;
            height: 80%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="main-content">
        <div class="container">
            <div class="status-badge">UNDETECTED (S-TIER)</div>
            <h1>VAL-AmmoCheck</h1>
            <p>專業級彈藥實時監測工具。透過外部疊加層（Overlay）實現，不修改遊戲內存，最大程度降低封號風險。</p>

            <ul class="feature-list">
                <li>實時讀取 Vandal/Phantom 剩餘子彈</li>
                <li>自定義 HUD 疊加位置（支援 4K 解析度）</li>
                <li>內建 Vanguard 偽裝機制 (Kernel-level Bypass)</li>
                <li>零延遲讀取，不影響 FPS</li>
            </ul>

            <!-- 修改為調用 JS 函數而不是直接跳轉 -->
            <a href="javascript:void(0)" onclick="startRickroll()" class="btn">下載 Installer (.exe)</a>

            <div class="warning">
                ⚠️ 注意：請在運行安裝程序前關閉所有防毒軟體，以免誤報導致安裝失敗。
            </div>
        </div>
    </div>

    <!-- 隱藏的播放器 -->
    <div id="video-container">
        <!-- 使用 embed 格式並加上 autoplay=1 (注意：大多數瀏覽器要求靜音才能自動播放，所以這裡建議由用戶點擊觸發) -->
        <iframe id="rick-video" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        function startRickroll() {
            // 1. 隱藏主內容
            document.getElementById('main-content').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('main-content').style.display = 'none';

                // 2. 顯示播放器容器
                const container = document.getElementById('video-container');
                container.style.display = 'flex';

                // 3. 設置影片網址 (使用 embed 模式 + 自動播放)
                // 影片 ID: eioYulMp_5k
                document.getElementById('rick-video').src = "https://www.youtube.com/embed/eioYulMp_5k?autoplay=1";
            }, 500);
        }
    </script>
</body>
</html>
